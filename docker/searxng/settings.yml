# Private instance: only exposed on localhost by Compose.
use_default_settings: true
server:
  bind_address: "0.0.0.0"
  port: 8080
  # Secret supplied by SEARXNG_SECRET, generated by scripts/docker.mjs.
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
