services:
  presencezero:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRESENCEZERO_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/data/presencezero.db
      SEARXNG_URL: http://searxng:8080
    volumes:
      - presencezero-data:/data
    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run npm run docker:up or npm run docker:search first}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  presencezero-data:
  searxng-cache:
